openapi: 3.0.3
info:
  title: Mango MDU Service API
  version: 1.0.0
  description: |
    Northbound API exposed by MDU for Phase 1 workflows.

    Phase 1 Core Scope:
    - Policy Overview orchestration for Operator UI (`GET /api/v1/policy/{id}/overview`)
    - Operational System APIs (`/livez`, `/system`)

    Integrations:
    - OWSEC: authentication, token validation, user profile lookup
    - PROV: management policies, management roles, entities, venues

servers:
  - url: /api/v1
    description: Relative API base path

tags:
  - name: System
    description: Operational diagnostics and liveness checks
  - name: Policies
    description: Policy overview and orchestration for operator UI

security:
  - bearerAuth: []

paths:
  /livez:
    servers:
      - url: "https://{host}:{publicPort}"
        description: Public HTTP Port Health Check
        variables:
          host:
            default: localhost
          publicPort:
            default: "16010"
    get:
      tags: [System]
      summary: Liveness probe
      description: Checks if the service is running and healthy. This route is unauthenticated.
      security: []
      responses:
        '200':
          description: Service is healthy and running

  /system:
    servers:
      - url: "https://{host}:{publicPort}/api/v1"
        description: Public HTTP API Interface
        variables:
          host:
            default: localhost
          publicPort:
            default: "16010"
    get:
      tags: [System]
      summary: Retrieve system diagnostics and metrics
      description: Returns system status info or resource usage based on the requested command.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum: [info, resources]
      responses:
        '200':
          description: Successful query execution
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'
    post:
      tags: [System]
      summary: Modify log levels or query diagnostics schema
      description: Dynamically mutate runtime subsystem log levels or fetch subsystem metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [setloglevel, getloglevels, getloglevelnames, getsubsystemnames]
                subsystems:
                  type: array
                  items:
                    type: object
                    required: [tag, value]
                    properties:
                      tag:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Successful action execution
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'

  /policy/{id}/overview:
    get:
      tags: [Policies]
      summary: Get Policy Overview
      description: |
        Retrieves live usage summary, metadata, and assigned users for a specific policy.
        Orchestrates data across OWPROV (management policies, management roles, hierarchy) and OWSEC (users).
      operationId: getPolicyOverview
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier (UUID) of the target management policy
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Policy overview details and usage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Unique correlation identifier for request tracing
      schema:
        type: string
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Distributed tracing correlation identifier
      schema:
        type: string

  schemas:
    UserPolicyScopeInfo:
      type: object
      required:
        - entityId
        - entityName
        - venueId
        - venueName
      properties:
        entityId:
          type: string
          description: Associated property (entity) UUID
          example: "entity-uuid-1"
        entityName:
          type: string
          description: Associated property name
          example: "Sunrise Apartments"
        venueId:
          type: string
          description: Associated venue UUID, or empty string if whole property
          example: ""
        venueName:
          type: string
          description: Associated venue name, or 'All venues' if unscoped
          example: "All venues"

    UserWithPolicySummary:
      type: object
      required:
        - id
        - name
        - email
        - userRole
        - scopedAssignmentsCount
        - scopes
      properties:
        id:
          type: string
          format: uuid
          description: User unique identifier (UUID)
          example: "user-uuid-1"
        name:
          type: string
          description: Full display name of the user
          example: "Anita Sharma"
        email:
          type: string
          format: email
          description: User email address
          example: "anita@ipnx.example"
        userRole:
          type: string
          description: User role designation in OWSEC
          example: "noc"
        avatar:
          type: string
          description: User avatar identifier or URL
          example: "1"
        scopedAssignmentsCount:
          type: integer
          description: Number of scoped role assignments for this user under this policy
          example: 2
        scopes:
          type: array
          description: List of scoped role assignments for this user under this policy
          items:
            $ref: '#/components/schemas/UserPolicyScopeInfo'

    PolicyMetadata:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
          description: Policy UUID
          example: "523e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Policy name
          example: "Network Operator"
        description:
          type: string
          description: Policy description
          example: "Monitor devices and manage network configuration."
        entity:
          type: string
          description: Scope entity ID if entity-specific, or empty string if global
          example: ""
        venue:
          type: string
          description: Scope venue ID if venue-specific, or empty string if global
          example: ""
        created:
          type: integer
          format: int64
          description: Creation Unix epoch timestamp (seconds)
          example: 1725000000
        modified:
          type: integer
          format: int64
          description: Last modification Unix epoch timestamp (seconds)
          example: 1725500000

    PolicyOverviewResponse:
      type: object
      required:
        - policy
        - totalUsers
        - totalScopedAssignments
        - totalProperties
        - totalVenues
        - usersWithPolicy
      properties:
        policy:
          $ref: '#/components/schemas/PolicyMetadata'
        totalUsers:
          type: integer
          description: Total unique users assigned to roles using this policy
          example: 9
        totalScopedAssignments:
          type: integer
          description: Total scoped assignments (roles) actively using this policy
          example: 14
        totalProperties:
          type: integer
          description: Total unique properties (entities) where this policy is applied
          example: 4
        totalVenues:
          type: integer
          description: Total unique venues where this policy is applied
          example: 12
        usersWithPolicy:
          type: array
          description: List of unique users assigned to roles referencing this policy
          items:
            $ref: '#/components/schemas/UserWithPolicySummary'

    ApiError:
      type: object
      required:
        - ErrorCode
        - ErrorDescription
      properties:
        ErrorCode:
          type: integer
          example: 400
        ErrorDescription:
          type: string
          example: "Bad Request"
        ErrorDetails:
          type: string
          example: "Invalid policy identifier"

  responses:
    BadRequestError:
      description: Invalid request parameters or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnauthorizedError:
      description: Authentication missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ForbiddenError:
      description: Insufficient permissions to access this policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFoundError:
      description: Requested policy not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BackendUnavailableError:
      description: Downstream dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
